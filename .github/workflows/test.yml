name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Exercise a real systemd user manager in a disposable account
        shell: bash
        run: |
          set -euo pipefail
          fixture_user=ab-fixture
          if getent passwd "$fixture_user" >/dev/null; then
            echo "Refusing to reuse an existing account"
            exit 1
          fi
          fixture_root=$(mktemp -d /tmp/agent-bridge-linux.XXXXXX)
          go build -o "$fixture_root/agent-bridge" ./cmd/agent-bridge
          go build -ldflags '-X github.com/Jhorlin/agent-bridge/internal/cli.Version=fixture-v2' -o "$fixture_root/agent-bridge-next" ./cmd/agent-bridge
          go test -race -c -o "$fixture_root/bridge.test" ./internal/bridge
          mkdir "$fixture_root/.config" "$fixture_root/tmp"
          sudo useradd --no-create-home --user-group --home-dir "$fixture_root" --shell /bin/sh "$fixture_user"
          fixture_uid=$(id -u "$fixture_user")
          cleanup() {
            sudo loginctl disable-linger "$fixture_user" || true
            sudo systemctl stop "user@$fixture_uid.service" || true
            sudo userdel "$fixture_user" || true
          }
          trap cleanup EXIT
          sudo chown -R "$fixture_user:$fixture_user" "$fixture_root"
          sudo loginctl enable-linger "$fixture_user"
          sudo systemctl start "user@$fixture_uid.service"
          sudo test -S "/run/user/$fixture_uid/bus"
          run_fixture() {
          sudo runuser -u "$fixture_user" -- env \
            HOME="$fixture_root" \
            XDG_CONFIG_HOME="$fixture_root/.config" \
            XDG_RUNTIME_DIR="/run/user/$fixture_uid" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$fixture_uid/bus" \
            TMPDIR="$fixture_root/tmp" \
            AGENT_BRIDGE_SYSTEMD_FIXTURE_ROOT="$fixture_root" \
            AGENT_BRIDGE_SYSTEMD_LIFECYCLE_TESTS=1 \
            AGENT_BRIDGE_SYSTEMD_RESTART_STAGE="$1" \
            "$fixture_root/bridge.test" -test.run "$2" -test.v -test.timeout 90s
          }
          run_fixture '' '^TestNativeSystemdServiceLifecycle$'
          run_fixture prepare '^TestNativeSystemdManagerRestart$'
          sudo systemctl stop "user@$fixture_uid.service"
          sudo systemctl start "user@$fixture_uid.service"
          sudo test -S "/run/user/$fixture_uid/bus"
          run_fixture verify '^TestNativeSystemdManagerRestart$'
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify published-alpha upgrade and legacy journal recovery
        run: AGENT_BRIDGE_UPGRADE_TESTS=1 go test -race ./internal/bridge -run '^TestPublishedAlphaUpgrade$' -count=1 -v
      - name: Verify exported systemd units without installing services
        if: runner.os == 'Linux'
        run: AGENT_BRIDGE_SYSTEMD_TESTS=1 go test ./internal/bridge -run '^TestNativeSystemdUnitVerify$' -count=1 -v
      - name: Package and smoke-test standalone archives
        run: AGENT_BRIDGE_PACKAGE_TESTS=1 go test ./internal/release -run '^TestNativePackage$' -count=1 -v
      - name: Fuzz MCP JSON parser
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzMCPJSON$' -fuzztime=5s -parallel=2
      - name: Fuzz MCP text preservation
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzMCPTextPreservation$' -fuzztime=5s -parallel=2
      - name: Fuzz agent adapter
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzPortableAgentRoundTrip$' -fuzztime=5s -parallel=2
      - name: Fuzz startup hook adapter
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzStartupHookRoundTrip$' -fuzztime=5s -parallel=2
      - name: Fuzz strict skill metadata
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzStrictSkillRoundTrip$' -fuzztime=5s -parallel=2
      - name: Fuzz skill invocation translation
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzSkillInvocationRoundTrip$' -fuzztime=5s -parallel=2
      - name: Fuzz namespaced plugin agent exports
        if: runner.os == 'Linux'
        run: go test ./internal/bridge -run '^$' -fuzz '^FuzzPluginAgentRoundTrip$' -fuzztime=5s -parallel=2
      - run: go build ./cmd/agent-bridge
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -trimpath -o dist/agent-bridge ./cmd/agent-bridge
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
